spring:
  application:
    name: gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_simulator
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: localhost
    port: 6379
    password: RedisCache2026
    timeout: 10s
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10s
app:
  cache:
    local:
      maximum-size: 10000
      expire-after-write: 30m
  redis:
    shutdown-timeout: 15s

server:
  port: 8080
